<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Собери фразу</title>
<meta name="robots" content="noindex"><meta name="theme-color" content="#0e1013">
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Вид и поведение повторяют модуль «Собери фразу» приложения Pith (панель ответа, чипы, пузыри, блик, тряска, салют) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0e1013;color:#e0e0e0;font-family:'Montserrat','Comfortaa',system-ui,sans-serif;font-size:14px;line-height:1.45;overflow-x:hidden}
/* Система чата приложения (PlayerFeed + feed.css): корень fixed, лента - отдельный прокручиваемый контейнер, перевёрнутый дважды (scaleY(-1)),
   поэтому scrollTop=0 = нижний край чата и новое сообщение видно без единой прокрутки; страница сама не прокручивается и дёргаться ей нечему.
   Индикатор «печатает» лежит вне потока в постоянно зарезервированном месте (--wait-slot), его появление ничего не двигает. */
:root{--wait-slot:28px;--safe-b:env(safe-area-inset-bottom,0px)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#0e1013}
#app::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(12px + var(--safe-b) + var(--wait-slot));pointer-events:none;z-index:90;background:linear-gradient(to top,rgba(14,16,19,1) 0%,rgba(14,16,19,.78) 28%,rgba(14,16,19,.42) 56%,rgba(14,16,19,.16) 80%,transparent 100%)}
.playerFeed{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:scaleY(-1);overflow-anchor:none;overscroll-behavior:none;padding:calc(12px + var(--safe-b) + var(--wait-slot)) 0 12px;scrollbar-width:none}
.playerFeed::-webkit-scrollbar{display:none;width:0;height:0}
.inner{transform:scaleY(-1);position:relative;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto;padding:0 10px;box-sizing:border-box}
#feed{display:flex;flex-direction:column;gap:6px;padding-top:16px}
#spacer{flex:none;height:0;margin-bottom:calc((var(--safe-b) + var(--wait-slot)) * -1);min-height:calc(var(--safe-b) + var(--wait-slot))}
.row{display:flex;justify-content:flex-start;padding:2px 0}
.row.right{justify-content:flex-end}
.bubble{background:#1a1d22;border-radius:4px 18px 18px 18px;padding:10px 14px;max-width:80%;word-break:break-word;position:relative}
.bubble.me{background:#16212e;border-radius:18px 18px 4px 18px;padding:6px 14px;max-width:80%}
.bubble.me::after{content:'';display:inline-block;width:12px;margin-left:7px;font-size:12px;font-weight:700;text-align:center}
.bubble.me.ok::after{content:'✓';color:#b6fe3b;animation:markIn .32s cubic-bezier(.22,1,.36,1) both,markFlash .5s cubic-bezier(.22,1,.36,1) 1.45s both}
.bubble.me.err::after{content:'✕';color:#f87171;animation:markIn .32s cubic-bezier(.22,1,.36,1) both}
.bubble.me.err{color:#f2c9c9}
/* жирным в чате только верный ответ и перевод */
.bubble{font-weight:400}.bubble.me.ok{font-weight:700}
@keyframes markIn{from{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.2)}to{opacity:1;transform:scale(1)}}
@keyframes markFlash{0%{color:#b6fe3b;transform:scale(1)}40%{color:#fff;transform:scale(1.45)}100%{color:#b6fe3b;transform:scale(1)}}
.sheen{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.sheen::before{content:'';position:absolute;top:0;bottom:0;left:0;width:300%;background-image:linear-gradient(100deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.18) 43%,rgba(255,255,255,.55) 47%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.55) 53%,rgba(255,255,255,.18) 57%,rgba(255,255,255,0) 64%);transform:translateX(-66.7%);opacity:0;animation:sheen .7s cubic-bezier(.35,0,.25,1) .05s 2 both}
@keyframes sheen{0%{transform:translateX(-66.7%);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateX(6.7%);opacity:0}}
.row.mid{justify-content:center}
.bubble.sys{background:none;padding:2px 0;color:#6f7885;font-size:12px;max-width:100%;text-align:center;border-radius:0}
.bubble.emo{background:none;padding:0 4px;font-size:30px;line-height:1.2}
.bubble.hint.bad{background:rgba(248,113,113,.10);color:#f87171}
/* «печатает»: три точки как WaitingDots приложения (пузырь #1a1d22, точка 5px, прыжок 1.2 с, выход 150 мс) */
.typingRow{position:absolute;left:0;right:0;bottom:calc(12px + var(--safe-b));height:24px;max-width:600px;margin:0 auto;padding:0 10px;z-index:95;pointer-events:none;animation:typIn .18s cubic-bezier(.34,1.56,.64,1) both;transform-origin:left bottom}.typingRow .bubble{display:inline-block;height:24px}.typingRow.out{animation:typOut .15s ease-in both}
@keyframes typIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@keyframes typOut{to{opacity:0;transform:scale(.4)}}
.typingB{border-radius:4px 14px 14px 14px;padding:5px 12px}
.dots{display:inline-flex;align-items:center;height:14px}
.dots i{width:5px;height:5px;margin:0 2px;border-radius:50%;background:#9aa0b4;animation:wb 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes wb{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-3px);opacity:1}}
/* кружок загрузки (как launchSpinner приложения) */
.veil{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(14,16,19,.86);transition:opacity .4s ease}.veil.off{opacity:0;pointer-events:none}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#b6fe3b;animation:spinr .78s linear infinite}@keyframes spinr{to{transform:rotate(360deg)}}
/* перевод под плавающими точками: нажатие раскрывает */
.bubble.tr2{padding:10px 14px}
.spoil{position:relative;display:block;min-width:140px;min-height:20px}
.spt{display:block;color:#b6fe3b;font-weight:700;opacity:0;transition:opacity .5s ease}
.spc{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);cursor:pointer;transition:opacity .45s ease}
.spoil.open .spt{opacity:1}.spoil.open .spc{opacity:0;pointer-events:none}
.exitRow{justify-content:center;padding:14px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.exitBtn{display:flex;align-items:center;justify-content:center;min-width:180px;height:46px;padding:0 24px;background:#12141d;border:2px solid #b6fe3b;border-radius:12px;font:inherit;font-size:15px;font-weight:700;color:#b6fe3b;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s}
.exitBtn:hover,.exitBtn:active{background:#b6fe3b;color:#000}
/* голосовое сообщение: как в приложении (AudioModule + audio.css): кнопка, волна на canvas с заливкой прогресса, таймер */
.bubble.audio{background:transparent;padding:8px 12px;width:fit-content;min-width:min(94%,calc(min(30vw,168px) + var(--audio-dur,4)*8px));max-width:94%;display:flex;flex-direction:column;gap:4px;overflow:hidden;position:relative;isolation:isolate}
.bubble.audio::before{content:'';position:absolute;inset:0;background:#1a1d22;border-radius:inherit;z-index:0;pointer-events:none}
.bubble.audio>*{position:relative;z-index:1}
.playerAudio{display:flex;flex-direction:column;width:100%}
.audioRow{display:flex;align-items:flex-start;width:100%}
.audioBtn{width:36px;height:36px;border-radius:50%;border:1.5px solid #b6fe3b;background:#b6fe3b;color:#0e1013;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;margin:0 8px 0 0;position:relative}
.audioBtn::after{content:'';position:absolute;inset:-6px}
.audioBtn svg{width:12px;height:12px;fill:#0e1013;stroke:#0e1013}
.waveCol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wave{display:block;width:100%;height:26px;transition:opacity .25s ease}.wave.pending{opacity:0}
.audMeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dur{font-size:9px;color:#888;font-family:'Comfortaa',system-ui,sans-serif;white-space:nowrap;line-height:1;padding-left:1px}
.ctl{display:flex;gap:6px;margin:-3px 0 -4px}
.chip{border:1px solid #2a2d35;background:#12141d;color:#9aa0b4;border-radius:9px;min-width:30px;height:22px;padding:0 7px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s,background .15s,transform .1s}
.chip:active{transform:scale(.94)}.chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{border-color:#b6fe3b;color:#b6fe3b;background:rgba(182,254,59,.08)}
.audioRing{animation:ringSpin .9s linear infinite}@keyframes ringSpin{to{transform:rotate(360deg)}}
/* перевод */
.rv{border:2px solid #2a2d35;background:#12141d;color:#e0e0e0;border-radius:12px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;transition:border-color .15s,transform .1s}
.rv:hover{border-color:#b6fe3b}.rv:active{transform:scale(.97)}
.tr{display:grid;place-items:start}.tr>*{grid-area:1/1;transition:opacity .4s ease,transform .4s ease}
.tr .txt{opacity:0;transform:translateY(8px);pointer-events:none}.tr.on .rv{opacity:0;transform:scale(.94);pointer-events:none}.tr.on .txt{opacity:1;transform:none}
/* панель ответа */
.phrasePanel{position:fixed;left:0;right:0;bottom:0;background:#1a1d22;border-top:1px solid #2a2d35;transform:translateY(100%);z-index:80;padding-bottom:env(safe-area-inset-bottom,0)}
.phrasePanel.show{transform:translateY(0)}
.phraseInner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px}
.phraseCounter{font-size:11px;color:#555d72;text-align:right;letter-spacing:.02em;opacity:0;transition:opacity .3s;min-height:16px}.phraseCounter.on{opacity:1}
.phraseAnswerRow{min-height:50px;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
.phraseAnswerRow.filled{border-color:rgba(255,255,255,.22)}
.phraseAnswerRow.err{animation:shake .6s ease}
.phraseAnswerPlaceholder{font-size:14px;color:#3a4050;margin:auto}
.phraseAnswerChip{background:none;border:none;padding:2px;font:inherit;font-size:15px;font-weight:700;color:#e8eaee;cursor:pointer;transition:opacity .15s,transform .15s;animation:chipIn .22s cubic-bezier(.22,1,.36,1) both}
.phraseAnswerChip:hover{opacity:.7;transform:scale(.95)}.phraseAnswerChip.red{color:#f87171}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.phrasePool{--h:38px;display:flex;flex-wrap:wrap;column-gap:8px;row-gap:0;justify-content:center;align-content:center;margin:-4px 0}
.phrasePool.two{min-height:calc(2*(var(--h) + 8px))}
.br{display:none}.br.on{display:block;flex:0 0 100%;height:0}
.phraseChip{height:var(--h);margin:4px 0;flex:0 0 auto;max-width:100%;display:inline-flex;align-items:center;white-space:nowrap;background:#12141d;border:2px solid #2a2d35;border-radius:12px;padding:0 16px;font:inherit;font-size:14px;font-weight:600;line-height:1;color:#e0e0e0;cursor:pointer;transition:border-color .15s,transform .1s,opacity .2s}
.phraseChip:hover:not(:disabled){border-color:#b6fe3b;transform:translateY(-2px)}
.phraseChip:active:not(:disabled){transform:scale(.95)}
.phraseChip.used{opacity:.25;cursor:default;pointer-events:none}
.phraseCheckBtn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;margin:0;padding:0 16px;background:#12141d;border:2px solid #b6fe3b;border-radius:12px;font-family:inherit;font-size:clamp(13px,3.6vw,16px);font-weight:700;line-height:1;white-space:nowrap;color:#b6fe3b;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s}
.phraseCheckBtn:hover:not(:disabled),.phraseCheckBtn:active:not(:disabled){background:#b6fe3b;color:#000}
.phraseCheckBtn:active:not(:disabled){transform:scale(.98)}
.phraseCheckBtn:disabled{opacity:.35;cursor:default}
.tries{display:flex;justify-content:center;gap:7px;margin-top:-2px}.tries i{width:8px;height:8px;border-radius:4px;background:#8b5cf6;transition:background .3s,transform .3s}.tries i.x{background:#f87171;transform:scale(1.15)}
.lockbar{display:none;flex-direction:column;align-items:center;gap:4px;padding:14px;text-align:center}
.phrasePanel.locked .lockbar{display:flex}.phrasePanel.locked .phraseInner{display:none}
.lockbar b{font-size:14px}.lockbar small{color:#6f7885;font-size:12px}.lockbar .lk{font-size:24px;animation:lk 2.4s ease-in-out infinite}
@keyframes lk{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(9deg)}30%{transform:rotate(0)}}
.err2{color:#6f7885;font-size:14px;padding:40px 18px;text-align:center}
@media (prefers-reduced-motion:reduce){.sheen::before{animation:sheenStill .7s ease-out .05s both}@keyframes sheenStill{0%,100%{opacity:0}45%{opacity:1}}}
.dbgBtn{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:200;height:22px;padding:0 8px;border-radius:11px;border:1px solid #2a2d35;background:rgba(18,20,29,.78);color:#6f7885;font:600 10px/20px 'Montserrat',system-ui,sans-serif;letter-spacing:.03em;cursor:pointer}
.dbgBtn:active{color:#b6fe3b;border-color:#b6fe3b}
.dbgBox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.86);display:none;flex-direction:column;gap:8px;padding:12px}
.dbgBox.on{display:flex}.dbgBox textarea{flex:1;background:#12141d;color:#cfd6e4;border:1px solid #2a2d35;border-radius:10px;padding:8px;font:11px/1.35 Consolas,monospace;resize:none}
.dbgBox button{height:38px;border-radius:10px;border:2px solid #b6fe3b;background:#12141d;color:#b6fe3b;font:700 14px 'Montserrat',system-ui,sans-serif}
</style></head><body>
<button class="dbgBtn" id="dbgBtn" aria-label="Лог">лог</button><div class="dbgBox" id="dbgBox"><textarea id="dbgTa" readonly></textarea><button id="dbgCopy">Скопировать</button><button id="dbgReset" style="border-color:#f87171;color:#f87171">Сбросить прогресс и начать заново</button><button id="dbgClose" style="border-color:#2a2d35;color:#9aa0b4">Закрыть</button></div>
<div class="veil" id="veil"><span class="spin"></span></div>
<div id="app"><div class="playerFeed" id="outer"><div class="inner" id="inner"><div id="feed"></div><div id="spacer"></div></div></div></div>
<div class="phrasePanel" id="panel">
 <div class="phraseInner">
  <div class="phraseCounter" id="cnt"></div>
  <div class="phraseAnswerRow" id="rowA"></div>
  <div class="phrasePool" id="pool"></div>
  <button class="phraseCheckBtn" id="chk" disabled>Проверить</button>
  <div class="tries" id="tries"></div>
 </div>
 <div class="lockbar"><span class="lk">🔒</span><b>Следующая попытка через <span id="lc"></span></b><small id="lt"></small></div>
</div>
<script>
// Журнал для разбора: события страницы, размеры окна, ошибки. Кнопка «лог» сверху копирует его (или показывает текст, чтобы выделить и скопировать).
(function(){
var t0=Date.now(),LG=[],last={};
function L(m){var d=((Date.now()-t0)/1000).toFixed(2);LG.push(d+" "+m);if(LG.length>900)LG.shift()}
window.__L=L;
function tg(){var w=window.Telegram&&Telegram.WebApp;return w?("tg "+w.platform+" v"+w.version+" vh="+w.viewportHeight+" stable="+w.viewportStableHeight+" exp="+w.isExpanded):"без Telegram"}
function snap(why){var f=document.getElementById("feed"),o=document.getElementById("outer"),p=document.getElementById("panel"),lr=f&&f.lastElementChild,vv=window.visualViewport;return why+": scrollTop="+Math.round(o?o.scrollTop:0)+" scrollH="+(o?o.scrollHeight:0)+"/"+(o?o.clientHeight:0)+" docScroll="+Math.round(scrollY)+" inner="+innerWidth+"x"+innerHeight+(vv?" vv="+Math.round(vv.width)+"x"+Math.round(vv.height)+"+"+Math.round(vv.offsetTop):"")+" panel="+(p&&p.classList.contains("show")?"показана h"+p.offsetHeight:"скрыта")+" feedH="+(f?f.offsetHeight:0)+" последнее.bottom="+(lr?Math.round(lr.getBoundingClientRect().bottom):"-")+" msgs="+(f?f.children.length:0)}
var PAGE_V="2026-11-15.7";L("страница версия "+PAGE_V);L("старт: "+navigator.userAgent);L(tg());L(snap("начало"));
window.addEventListener("error",function(e){L("ОШИБКА: "+e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno)});
window.addEventListener("unhandledrejection",function(e){L("ОШИБКА промиса: "+(e.reason&&e.reason.message||e.reason))});
// самообновление: Safari и GitHub Pages держат старый HTML в кэше. Раз за сессию страница запрашивает свежую копию и, если версия другая, перезагружается
window.__pvCheck=new Promise(function(res){try{if(sessionStorage.getItem("pv-reloaded")){res(false);return}
 fetch(location.pathname+"?v="+Date.now(),{cache:"reload"}).then(function(r){return r.text()}).then(function(t){var m=/PAGE_V="([^"]+)"/.exec(t);
  if(m&&m[1]!==PAGE_V){sessionStorage.setItem("pv-reloaded","1");L("страница устарела ("+PAGE_V+" → "+m[1]+"), перезагрузка");var go=function(){res(true);location.reload()};fetch(location.pathname,{cache:"reload"}).then(go,go)}
  else{L("версия страницы актуальна");res(false)}}).catch(function(){res(false)})}catch(e){res(false)}});
var rs=0;window.addEventListener("resize",function(){rs++;L("resize #"+rs+" "+innerWidth+"x"+innerHeight)});
if(window.visualViewport){var vc=0;visualViewport.addEventListener("resize",function(){vc++;if(vc<40)L("visualViewport resize "+Math.round(visualViewport.height))})}
var sc=0,sl=0;document.getElementById("outer").addEventListener("scroll",function(){sc++;var n=Date.now();if(n-sl>400){sl=n;L("лента scrollTop → "+Math.round(this.scrollTop)+" (событий "+sc+")");sc=0}},{passive:true});window.addEventListener("scroll",function(){L("СТРАНИЦА прокрутилась → "+Math.round(scrollY))},{passive:true});
// переходы, которые страница сама делает: сообщения, панель
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1&&n.className&&String(n.className).indexOf("row")>=0)L("+ "+String(n.firstElementChild&&n.firstElementChild.className||n.className)+": "+String(n.textContent).trim().slice(0,40))});m.removedNodes.forEach(function(n){if(n.nodeType===1&&String(n.className).indexOf("typingRow")>=0)L("- точки")})})}).observe(document.getElementById("feed"),{childList:true});
var pn=document.getElementById("panel");if(pn)new MutationObserver(function(){L(snap("панель "+(pn.classList.contains("show")?"показана":"скрыта")))}).observe(pn,{attributes:true,attributeFilter:["class"]});
// каждые 700 мс: если размеры/прокрутка поменялись, запись (так видно дрожание: прокрутка и высота прыгают без причины)
setInterval(function(){var f=document.getElementById("feed"),o=document.getElementById("outer"),k=(o?o.scrollTop+"|"+o.scrollHeight:"")+"|"+scrollY+"|"+innerHeight+"|"+(f?f.offsetHeight:0);if(k!==last.k){last.k=k;L(snap("изменение"))}},700);
function text(){return LG.join("\n")+"\n"+snap("итог")+"\n"+tg()}
var box=document.getElementById("dbgBox"),ta=document.getElementById("dbgTa");
document.getElementById("dbgBtn").onclick=function(){var tx=text();ta.value=tx;box.classList.add("on");try{navigator.clipboard.writeText(tx).then(function(){document.getElementById("dbgCopy").textContent="Скопировано ✓"},function(){})}catch(e){}};
document.getElementById("dbgCopy").onclick=function(){var tx=ta.value;try{navigator.clipboard.writeText(tx).then(function(){document.getElementById("dbgCopy").textContent="Скопировано ✓"},function(){ta.select();document.execCommand("copy")})}catch(e){ta.select();try{document.execCommand("copy")}catch(_){}}};
document.getElementById("dbgReset").onclick=function(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("trainer:")===0)localStorage.removeItem(k)})}catch(e){}location.reload()};
document.getElementById("dbgClose").onclick=function(){box.classList.remove("on");document.getElementById("dbgCopy").textContent="Скопировать"}
})();
</script>
<script>
// Задание: старая ссылка #p=…, короткая #<id> или Mini App (tgWebAppStartParam); задание и звук лежат рядом со страницей: t/<id>.json, a/<id>.mp3
// Попытки и блокировка хранятся в браузере (localStorage); строгую блокировку по пользователю может дать только бот.
(function(){

  var w=document.createElement("div");w.className="spoil";w.innerHTML='<span class="spt">'+esc(text)+'</span><canvas class="spc" aria-label="Нажмите, чтобы раскрыть перевод"></canvas>';
  var b=msg("tr2",w),cv=w.querySelector(".spc"),dpr=window.devicePixelRatio||1,W=0,H=0,pts=[],raf=0,open=false,ctx=cv.getContext("2d");
  function init(){W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);var n=Math.max(26,Math.round(W*H/55));pts=[];for(var k=0;k<n;k++)pts.push({x:R()*W,y:R()*H,vx:(R()-.5)*.7,vy:(R()-.5)*.7,r:1.3+R()*1.6,a:.4+R()*.55,g:R()<.35})}
  function frame(){if(open)return;ctx.clearRect(0,0,W,H);for(var k=0;k<pts.length;k++){var p=pts[k];p.vx+=(R()-.5)*.1;p.vy+=(R()-.5)*.1;var sp=Math.sqrt(p.vx*p.vx+p.vy*p.vy);if(sp>.75){p.vx*=.75/sp;p.vy*=.75/sp}p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.fillStyle=p.g?"rgba(182,254,59,"+p.a+")":"rgba(255,255,255,"+p.a+")";ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill()}raf=requestAnimationFrame(frame)}
  later(function(){init();frame()},40);
  cv.onclick=function(){if(open)return;open=true;w.classList.add("open");later(function(){cancelAnimationFrame(raf)},600)}}
 function exitBtn(){var r=document.createElement("div");r.className="row exitRow";r.innerHTML='<button class="exitBtn">Выйти</button>';feed.appendChild(r);scrollNow();slideIn(r,false);
  r.querySelector("button").onclick=function(){try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData){Telegram.WebApp.close();return}}catch(e){}try{window.close()}catch(e){}later(function(){r.innerHTML='<div class="bubble sys">Можно закрыть эту страницу</div>'},300)}}

 // ── финал: фраза ответом, смайлик отдельным сообщением, перевод под точками, «скоро выйдет разбор», «Выйти»
 function finale(fire){
  var me=msg("me ok",esc(C.e),true);var sh=document.createElement("span");sh.className="sheen";me.appendChild(sh);
  if(fire){snd("xp-gain")}
  // ответ → пауза → смайлик-салют → точки «печатает» → бокс с переводом → точки 2 с → «Скоро выйдет полный разбор» → точки 1 с → «Выйти»
  later(function(){emo("🎉");
   later(function(){typing(TYPE_NEXT,function(){spoilerBubble(C.r||"");
    later(function(){typing(2000,function(){msg("","Скоро выйдет полный разбор этой фразы");
     later(function(){typing(1000,exitBtn)},REACT)})},900)})},REACT)},fire?2600:300)}

 chk.onclick=function(){
  if(busy||locked()||!placed.length)return;
  var marks=placed.map(function(p,k){return norm(p.w)===norm(toks[k]||"")}),right=placed.length===toks.length&&marks.every(Boolean);
  if(right){busy=true;S.solved=true;save();snd("answer-correct");chk.disabled=true;
   later(function(){fireBurst(30,4);later(function(){fireBurst(18,4)},260);closePanel();later(function(){finale(true)},420)},700);return}
  if(placed.length<toks.length&&marks.every(Boolean)){msg("hint","Ты на верном пути, фраза не полная");later(function(){emo("👍")},REACT);return}
  // неверно: ответ в чат, смайлик, подсказка учителя и системное сообщение с числом оставшихся попыток
  busy=true;S.left--;wrongN++;save();snd("answer-wrong");red=placed.map(function(p){return p.i});drawRow(false);rowA.classList.add("err");drawTries();
  msg("me err",esc(placed.map(function(p){return p.w}).join(" ")),true);
  if(S.left<=0){S.until=Date.now()+LOCK_H*3600000;save();
   later(function(){closePanel();later(function(){msg("hint bad","Попытки закончились. Следующая попытка откроется "+atTxt(S.until)+".");panel.classList.add("locked");lockUi()},350)},700);return}
  later(function(){emo("🤔");later(function(){typing(600,function(){
   if(wrongN===1)msg("hint bad","Не совсем. Послушай ещё раз и попробуй снова.");
   else msg("hint bad","Собери фразу из "+toks.length+" "+(toks.length%10===1&&toks.length!==11?"слова":"слов")+".");
   later(function(){sys(triesLeft(S.left));rowA.classList.remove("err");red=[];busy=false;draw()},REACT)})},REACT)},500)};

 // ── запуск: точки «печатает», реплика, точки, голосовое с дорожкой звука (его можно слушать и ставить на повтор), затем панель выезжает снизу
 function afterVoice(){
  if(S.solved){later(function(){finale(false)},500);return}
  if(locked()){later(function(){msg("hint bad","Попытки закончились. Следующая попытка откроется "+atTxt(S.until)+".");lockUi()},500);setInterval(function(){if(S.until&&Date.now()>=S.until)location.reload();else $("#lc").textContent=leftTxt(S.until-Date.now())},30000);return}
  draw();later(openPanel,600)}
 var AU,SU;AP.then(function(v){AU=v});SP.then(function(v){SU=v});
 Promise.all([AP,SP]).then(function(){later(function(){veilOff()},200)},function(){veilOff()});
 // слушание: следующее сообщение выходит, когда голосовое дослушано, а если его не включали, то через 3 с после появления
 function listened(vc){return new Promise(function(res){var d=false;function fin(){if(!d){d=true;res()}}vc.ended.then(fin);later(function(){if(!vc.isPlaying())fin();else later(fin,15000)},3000)})}
 // сценарий: точки → голосовое (обычное) → точки → «Вот в два раза медленнее» → точки → голосовое (замедленное) → точки → панель сборки выезжает
 function toPanel(){typing(TYPE_NEXT,function(){afterVoice()})}
 typing(TYPE_FIRST,function(){
  if(!AU){msg("hint","Звука для этой фразы нет: прислушайтесь к видео.");toPanel();return}
  var v1=audioBubble(AU.w,AK,false);
  if(!SU){listened(v1).then(toPanel);return}
  listened(v1).then(function(){typing(TYPE_NEXT,function(){msg("","Вот в два раза медленнее");
   later(function(){typing(TYPE_NEXT,function(){audioBubble(SU.w,SK,true);later(toPanel,REACT)})},REACT)})})},Promise.all([AP,SP]))}

// звуки интерфейса грузятся заранее, чтобы первое сообщение не ждало файлов
function preloadSounds(){["message-in","typing-1","answer-correct","answer-wrong","xp-gain"].forEach(function(n){try{var a=new Audio("s/"+n+".mp3");a.preload="auto";snds[n]=a}catch(e){}})}
function cleanTxt(t){return String(t||"").replace(/\s*\[пост\]/gi,"").replace(/\s+/g," ").trim()}
function veilOff(){var v=document.getElementById("veil");if(v)v.classList.add("off")}
function boot(){
 preloadSounds();
 var c=readC();if(c){c.e=cleanTxt(c.e);c.r=cleanTxt(c.r);start(c);return}
 var id=idOf();if(!id){$("#feed").innerHTML='<div class="err2">Ссылка без задания.<br>Откройте тест по кнопке под видео.</div>';veilOff();return}
 // звук и задание лежат под одним id: оба файла просим одновременно, пока страница ещё показывает кружок
 var pre=loadWave("a/"+id+".mp3"),preS=loadWave("a/"+id+"s.mp3");
 
 fetch("t/"+id+".json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(!j||!j.e)throw 0;j.e=cleanTxt(j.e);j.r=cleanTxt(j.r);if(window.__L)window.__L("задание: "+JSON.stringify({e:j.e,a:j.a,s:j.s,t:j.t}));j.id=id;j.pre=pre;j.preS=preS;$("#feed").innerHTML="";start(j)}).catch(function(){$("#feed").innerHTML='<div class="err2">Не удалось загрузить задание.<br>Попробуйте ещё раз через минуту: страница обновляется.</div>';veilOff()})}
(window.__pvCheck?Promise.race([window.__pvCheck,new Promise(function(r){setTimeout(function(){r(false)},1500)})]):Promise.resolve(false)).then(function(rl){if(!rl)boot()});
})();
